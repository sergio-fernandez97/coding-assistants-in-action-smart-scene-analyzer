<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">Four coordinate spaces, one for fusion</title>
  <desc id="desc">The source image is letterboxed twice: to 640 by 640 for the YOLO11 detector, and to 518 by 518 for Depth Anything V2, because 518 is a multiple of the ViT patch size 14 and 640 is not. Boxes are rescaled and the depth map is resized back into one shared space before fusion: source pixels in the Python reference, the 640 model input on the handset. Fusion takes the median depth per box and converts nothing. A 518 by 518 map reaching fusion means an upstream resize was skipped, and fusion raises naming both shapes. The fused result is finally drawn in screen points by the Lesson 05 overlay.</desc>
  <style>
    .box { stroke-width: 2; rx: 13; }
    .heading { font: 700 21px system-ui, sans-serif; fill: #152238; }
    .sub { font: 700 16px system-ui, sans-serif; fill: #152238; }
    .label { font: 15px system-ui, sans-serif; fill: #152238; }
    .small { font: 13px system-ui, sans-serif; fill: #34445f; }
    .mono { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #34445f; }
    .arrow { stroke: #4169a8; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .flag { font: 700 13px system-ui, sans-serif; fill: #b54747; }
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4169a8"/></marker></defs>
  <rect width="960" height="470" fill="#f8fbff"/>

  <text x="35" y="38" class="heading">Four coordinate spaces, and fusion lives in exactly one</text>
  <text x="35" y="62" class="small">Every resize happens before fusion. Fusion checks shapes and converts nothing.</text>

  <!-- SOURCE -->
  <rect x="30" y="170" width="150" height="120" class="box" fill="#ffffff" stroke="#8fa3c2"/>
  <text x="105" y="205" class="sub" text-anchor="middle">SOURCE</text>
  <text x="105" y="232" class="label" text-anchor="middle">H × W</text>
  <text x="105" y="258" class="small" text-anchor="middle">camera or picker</text>

  <!-- MODEL_INPUT -->
  <rect x="250" y="95" width="200" height="105" class="box" fill="#eef4ff" stroke="#4169a8"/>
  <text x="350" y="125" class="sub" text-anchor="middle">MODEL_INPUT</text>
  <text x="350" y="150" class="label" text-anchor="middle">640 × 640, letterboxed</text>
  <text x="350" y="176" class="small" text-anchor="middle">YOLO11 → xyxy boxes</text>

  <!-- DEPTH_INPUT -->
  <rect x="250" y="260" width="200" height="105" class="box" fill="#eef4ff" stroke="#4169a8"/>
  <text x="350" y="290" class="sub" text-anchor="middle">DEPTH_INPUT</text>
  <text x="350" y="315" class="label" text-anchor="middle">518 × 518, letterboxed</text>
  <text x="350" y="341" class="small" text-anchor="middle">518 = 14 × 37 · Depth Anything V2</text>

  <path d="M180,205 L246,152" class="arrow"/>
  <path d="M180,255 L246,308" class="arrow"/>

  <!-- back into one space -->
  <path d="M450,148 L576,200" class="arrow"/>
  <text x="520" y="155" class="small" text-anchor="middle">rescale boxes</text>
  <path d="M450,312 L576,262" class="arrow"/>
  <text x="522" y="318" class="small" text-anchor="middle">resize map back</text>

  <!-- FUSION -->
  <rect x="580" y="160" width="200" height="145" class="box" fill="#ffffff" stroke="#152238"/>
  <text x="680" y="190" class="sub" text-anchor="middle">fusion.py</text>
  <text x="680" y="214" class="small" text-anchor="middle">one space in, converts none</text>
  <text x="680" y="236" class="small" text-anchor="middle">median depth per box</text>
  <text x="680" y="264" class="mono" text-anchor="middle">Python:  SOURCE px</text>
  <text x="680" y="284" class="mono" text-anchor="middle">handset: MODEL_INPUT</text>

  <!-- SCREEN -->
  <rect x="815" y="180" width="125" height="105" class="box" fill="#ffffff" stroke="#8fa3c2"/>
  <text x="877" y="212" class="sub" text-anchor="middle">SCREEN</text>
  <text x="877" y="238" class="small" text-anchor="middle">points, per device</text>
  <text x="877" y="260" class="small" text-anchor="middle">Lesson 05 overlay</text>
  <path d="M780,232 L811,232" class="arrow"/>

  <!-- the flag -->
  <text x="580" y="345" class="flag">A 518 × 518 map reaching fusion = a skipped resize.</text>
  <text x="580" y="365" class="flag">Raise, naming both shapes. Never resize it here.</text>

  <text x="35" y="420" class="label">A box read in the wrong space still returns a number, in range, from the wrong part of the image.</text>
  <text x="35" y="444" class="small">Only a shape assertion and a non-square test image catch it. Lesson 03 drew two of these spaces; this is all four.</text>
</svg>
